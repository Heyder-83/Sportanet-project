<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Eventos deportivos - Sportanet">
    <meta name="theme-color" content="#001f3f">
    <title>Eventos - Sportanet</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="CSS/header.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/events.css">
</head>
<body>
    <!-- Contenedor para cargar el header dinámicamente -->
    <div id="header-container"></div>
    
    <!-- Contenido principal -->
    <main>
        <section class="eventos" id="eventos">
            <h2>Eventos</h2>
            <p class="eventos-descripcion">Descubre y participa en los mejores eventos deportivos</p>

            <!-- Buscador por nombre -->
            <form class="eventos-buscador" id="buscador" role="search" autocomplete="off">
                <label for="buscador-input" class="sr-only">Buscar eventos por nombre</label>
                <div class="buscador-campo">
                    <input id="buscador-input" name="q" type="search" maxlength="100" placeholder="Buscar eventos por nombre…" enterkeyhint="search">
                    <button type="button" id="buscador-limpiar" class="buscador-limpiar" aria-label="Borrar búsqueda" hidden>&times;</button>
                </div>
                <button type="submit" class="btn-buscar">Buscar</button>
            </form>

            <!-- Próximos / Pasados -->
            <div class="eventos-controles">
                <div class="eventos-tabs" role="tablist" aria-label="Tipo de eventos">
                    <button type="button" class="eventos-tab" role="tab" data-when="upcoming" aria-selected="true" aria-controls="eventos-grid">Próximos</button>
                    <button type="button" class="eventos-tab" role="tab" data-when="past" aria-selected="false" aria-controls="eventos-grid" tabindex="-1">Pasados</button>
                </div>
                <div class="eventos-orden">
                    <p class="eventos-resumen" id="eventos-resumen" aria-live="polite"></p>
                    <label for="orden" class="sr-only">Ordenar eventos</label>
                    <select id="orden" class="eventos-select">
                        <option value="">Orden predeterminado</option>
                        <option value="name_asc">Nombre (A-Z)</option>
                        <option value="name_desc">Nombre (Z-A)</option>
                        <option value="newest">Más nuevos primero</option>
                        <option value="oldest">Más antiguos primero</option>
                    </select>
                </div>
            </div>

            <!-- Las tarjetas las genera JS/events.js a partir de la API -->
            <div class="eventos-grid" id="eventos-grid" role="tabpanel" aria-busy="true">
                <div class="evento-placeholder"><p>Cargando eventos…</p></div>
            </div>

            <div class="eventos-mas" id="eventos-mas" hidden>
                <button type="button" class="btn-mas" id="btn-mas">Ver más eventos</button>
            </div>

            <p class="eventos-aviso" id="eventos-aviso" role="status" hidden></p>
        </section>

        <!-- Detalle de un evento -->
        <dialog class="evento-dialog" id="evento-dialog" aria-labelledby="evento-dialog-titulo">
            <button type="button" class="evento-dialog-cerrar" id="evento-dialog-cerrar" aria-label="Cerrar detalle">&times;</button>
            <div id="evento-dialog-body"></div>
        </dialog>

        <section class="contacto" id="contacto">
            <h2>Contáctanos</h2>
            <p>¿Tienes preguntas? Escríbenos a <a href="mailto:sportanet@gmail.com">sportanet@gmail.com</a></p>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Sportanet - Todos los derechos reservados.</p>
    </footer>

    <!-- Eventos (API pública) -->
    <script src="JS/events.js"></script>

    <!-- Script para cargar el header -->
    <script>
        /**
         * Carga el header dinámicamente desde header.html
         */
        async function loadHeader() {
            const headerContainer = document.getElementById('header-container');
            try {
                const response = await fetch('includes/header.html');
                if (!response.ok) throw new Error('Error al cargar el header');
                
                const html = await response.text();
                headerContainer.innerHTML = html;

                // Cargar el script de header después de insertar el HTML
                const script = document.createElement("script");
                script.src = "JS/header.js";
                script.onload = () => {
                    if (typeof initHeaderEvents === 'function') {
                        initHeaderEvents();
                    }
                };
                document.body.appendChild(script);
            } catch (error) {
                console.error('Error al cargar el encabezado:', error);
                headerContainer.innerHTML = '<header class="navbar"><p style="color: red;">Error al cargar el menú</p></header>';
            }
        }

        // Cargar el header cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadHeader);
        } else {
            loadHeader();
        }
    </script>
</body>
</html>
