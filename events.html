<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="CSS/header.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <!-- Script general para cargar el header a cualquier html -->
    <div id="header-container"></div>
    
    <!-- Script que carga el encabezado -->
    <script>
        const headerContainer = document.getElementById('header-container');
    
        fetch('includes/header.html')
            .then(response => response.text())
            .then(html => {
                headerContainer.innerHTML = html;
            
                // IMPORTANTE: cargar y ejecutar header.js DESPUÉS
                const script = document.createElement("script");
                script.src = "JS/header.js";
                script.onload = () => initHeaderEvents(); 
                document.body.appendChild(script);
            })
            .catch(error => {   
                console.error('Error al cargar el encabezado:', error);
            });
    </script>


    <main>
        <section class="contacto" id="contacto">
            <h2>Contáctanos</h2>
            <p>¿Tienes preguntas? Escríbenos a sportanet@gmail.com</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Sportanet - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
