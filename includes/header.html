<!-- MODAL LOGIN/REGISTRO -->
<div id="modal-auth" class="modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-content">
        <!-- BOTÓN CERRAR -->
        <button id="close-modal" class="close" aria-label="Cerrar modal">&times;</button>

        <!-- FORMULARIO LOGIN -->
        <form id="form-login" class="auth-form active-form">
            <h2 id="modal-title">Iniciar Sesión</h2>
            
            <div class="form-group">
                <label for="login-email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="login-email" 
                    name="email"
                    placeholder="tu@email.com" 
                    required
                    aria-label="Correo electrónico"
                >
                <span class="error-message" id="error-login-email"></span>
            </div>

            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input 
                    type="password" 
                    id="login-password" 
                    name="password"
                    placeholder="Mínimo 6 caracteres" 
                    required
                    aria-label="Contraseña"
                >
                <span class="error-message" id="error-login-password"></span>
            </div>

            <button type="submit" class="btn btn-primary" id="btn-submit-login">Ingresar</button>
            <div class="form-message" id="login-message"></div>

            <p class="toggle-form">
                ¿No tienes cuenta? 
                <button type="button" id="mostrar-registro" class="link-button">Regístrate aquí</button>
            </p>
        </form>

        <!-- FORMULARIO REGISTRO -->
        <form id="form-registro" class="auth-form">
            <h2 id="modal-title">Crear Cuenta</h2>
            
            <div class="form-group">
                <label for="reg-nombre">Nombre Completo</label>
                <input 
                    type="text" 
                    id="reg-nombre" 
                    name="nombre"
                    placeholder="Juan Pérez" 
                    required
                    aria-label="Nombre completo"
                >
                <span class="error-message" id="error-reg-nombre"></span>
            </div>

            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="reg-email" 
                    name="email"
                    placeholder="tu@email.com" 
                    required
                    aria-label="Correo electrónico"
                >
                <span class="error-message" id="error-reg-email"></span>
            </div>

            <div class="form-group">
                <label for="reg-phone">Teléfono</label>
                <input 
                    type="tel" 
                    id="reg-phone" 
                    name="phone"
                    placeholder="+57 (123) 456-7890" 
                    required
                    aria-label="Número de teléfono"
                >
                <span class="error-message" id="error-reg-phone"></span>
            </div>

            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <input 
                    type="password" 
                    id="reg-password" 
                    name="password"
                    placeholder="Mínimo 6 caracteres" 
                    required
                    minlength="6"
                    aria-label="Contraseña"
                >
                <span class="error-message" id="error-reg-password"></span>
            </div>

            <div class="form-group">
                <label for="reg-password-confirm">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="reg-password-confirm" 
                    name="password_confirm"
                    placeholder="Repite tu contraseña" 
                    required
                    aria-label="Confirmación de contraseña"
                >
                <span class="error-message" id="error-reg-password-confirm"></span>
            </div>

            <button type="submit" class="btn btn-primary" id="btn-submit-registro">Crear Cuenta</button>
            <div class="form-message" id="registro-message"></div>

            <p class="toggle-form">
                ¿Ya tienes cuenta? 
                <button type="button" id="mostrar-login" class="link-button">Inicia sesión aquí</button>
            </p>
        </form>
    </div>
</div>

<!-- MODAL PERFIL DE USUARIO -->
<div id="modal-perfil" class="modal" role="dialog" aria-labelledby="perfil-title" aria-hidden="true">
    <div class="modal-content modal-perfil">
        <!-- BOTÓN CERRAR -->
        <button id="close-perfil-modal" class="close" aria-label="Cerrar modal">&times;</button>

        <!-- FORMULARIO EDITAR PERFIL -->
        <form id="form-editar-perfil" class="auth-form">
            <h2 id="perfil-title">Mi Perfil</h2>
            
            <div class="form-group">
                <label for="perfil-nombre">Nombre Completo</label>
                <input 
                    type="text" 
                    id="perfil-nombre" 
                    name="nombre"
                    placeholder="Juan Pérez" 
                    required
                    aria-label="Nombre completo"
                    readonly
                >
                <span class="error-message" id="error-perfil-nombre"></span>
            </div>

            <div class="form-group">
                <label for="perfil-email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="perfil-email" 
                    name="email"
                    placeholder="tu@email.com" 
                    required
                    aria-label="Correo electrónico"
                    readonly
                >
                <span class="error-message" id="error-perfil-email"></span>
            </div>

            <div class="form-group">
                <label for="perfil-phone">Teléfono</label>
                <input 
                    type="tel" 
                    id="perfil-phone" 
                    name="phone"
                    placeholder="+57 (123) 456-7890" 
                    required
                    aria-label="Número de teléfono"
                    readonly
                >
                <span class="error-message" id="error-perfil-phone"></span>
            </div>

            <!-- Acciones en modo solo lectura -->
            <div id="perfil-readonly-actions">
                <button type="button" class="btn btn-secondary" id="btn-editar-perfil">Editar Perfil</button>
            </div>

            <div class="perfil-buttons" id="perfil-buttons" style="display:none;">
                <button type="submit" class="btn btn-primary" id="btn-guardar-perfil">Guardar Cambios</button>
                <button type="button" class="btn btn-secondary" id="btn-cancelar-perfil">Cancelar</button>
            </div>
            <div class="form-message" id="perfil-message"></div>

            <!-- ZONA DE PELIGRO -->
            <div class="danger-zone" id="danger-zone">
                <h3>Zona de Peligro</h3>
                <p>Estas acciones no se pueden deshacer.</p>
                <button type="button" class="btn btn-danger" id="btn-eliminar-cuenta">Eliminar Mi Cuenta</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL CONFIRMAR ELIMINACIÓN -->
<div id="modal-confirmar-eliminar" class="modal" role="dialog" aria-labelledby="confirmar-title" aria-hidden="true">
    <div class="modal-content modal-confirmar">
        <h2 id="confirmar-title">Confirmar Eliminación</h2>
        <p>¿Estás seguro de que deseas eliminar tu cuenta?</p>
        <p class="warning-text">Esta acción es <strong>permanente</strong> y no se puede deshacer.</p>
        
        <div class="modal-buttons">
            <button id="btn-cancelar-eliminar" class="btn btn-secondary">Cancelar</button>
            <button id="btn-confirmar-eliminar" class="btn btn-danger">Sí, Eliminar Mi Cuenta</button>
        </div>
    </div>
</div>
